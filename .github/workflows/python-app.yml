name: Python CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y portaudio19-dev

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f EchoNoteAI/requirements.txt ]; then pip install -r EchoNoteAI/requirements.txt; fi
        # NoteReaderAI and OmniNoteAI require pywin32 (Windows-only), skipping on Ubuntu runner
        # if [ -f NoteReaderAI/requirements.txt ]; then pip install -r NoteReaderAI/requirements.txt; fi
        # if [ -f OmniNoteAI/requirements.txt ]; then pip install -r OmniNoteAI/requirements.txt; fi

    - name: Run Tests with Coverage (EchoNoteAI)
      run: |
        cd EchoNoteAI
        pytest --cov=./ --cov-report=xml tests/
        
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        slug: vijay8056/GENAI
